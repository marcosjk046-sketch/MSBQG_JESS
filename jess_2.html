<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para_jessica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f, #24123d);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .card {
            text-align: center;
            background: rgba(255,255,255,0.06);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(127,92,255,0.4);
            max-width: 90%;
            z-index: 10;
        }

        h1 {
            color: #c7a6ff;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
            min-height: 60px;
        }

        button {
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s ease, top 0.3s ease, left 0.3s ease;
        }

        #si {
            background: #7f5cff;
            color: white;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            /* Se asegura que el botón SÍ mantenga su origen de alineación */
            transform-origin: center center;
        }

        #subtexto-si {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: normal;
            display: none;
        }

        #no {
            background: #333;
            color: #ddd;
            z-index: 25;
            touch-action: manipulation;
        }

        .credits {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            z-index: 30;
            pointer-events: none;
            text-align: right;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>¿Querés intentar algo conmigo?</h1>
    <div class="buttons">
        <button id="si" onclick="aceptar()">
            <span>Sí</span>
            <span id="subtexto-si"></span>
        </button>
        <button id="no" onclick="interaccionNo(event)" onmouseover="interaccionNo(event)" ontouchstart="interaccionNo(event)">No</button>
    </div>
</div>

<div class="credits">
    From: Marcos<br>
    To: Jessica
</div>

<script>
    let escala = 1;
    let textosNo = [
        "¿segura?",
        "pensalo bien",
        "dale una oportunidad",
        "no es tan mala idea",
        "última chance...",
        "de verdad no?",
        "mira lo grande que está el SÍ",
        "ya casi no podés apretar acá",
        "insisto...",
        "no seas mala 🥺"
    ];
    let intentos = 0;

    function obtenerPosicionAleatoria(elemento) {
        const padding = 20;
        const maxX = window.innerWidth - elemento.offsetWidth - padding;
        const maxY = window.innerHeight - elemento.offsetHeight - padding;

        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        return { x: randomX, y: randomY };
    }

    function actualizarBotonSi() {
        escala += 0.35;
        const btnSi = document.getElementById("si");
        const subtexto = document.getElementById("subtexto-si");

        btnSi.style.transform = `scale(${escala})`;

        subtexto.style.display = "block";
        if (intentos < textosNo.length) {
            subtexto.innerText = textosNo[intentos];
        } else {
            subtexto.innerText = `Intento #${intentos + 1} (imposible esquivar el SÍ)`;
        }

        intentos++;
    }

    function interaccionNo(e) {
        if (e) e.preventDefault(); // Previene toques dobles o clics por defecto en móviles

        const btnNo = document.getElementById("no");
        btnNo.style.position = "fixed";

        const pos = obtenerPosicionAleatoria(btnNo);
        btnNo.style.left = `${pos.x}px`;
        btnNo.style.top = `${pos.y}px`;

        actualizarBotonSi();
    }

    function aceptar() {
        document.body.innerHTML = `
            <div style="
                color:white;
                text-align:center;
                font-family:'Segoe UI', sans-serif;">
                <h1 style="color:#b18cff;">Sabía que sí 💜</h1>
                <p>Prometo cuidarte y hacer que valga la pena.</p>
            </div>
            <div class="credits">
                From: Marcos<br>
                To: Jessica
            </div>
        `;
    }
</script>

</body>
</html>
